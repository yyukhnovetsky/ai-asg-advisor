[build-system]
requires = ["setuptools>=75.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-asg-advisor"
version = "0.1.0"
description = "CLI tool that uses LLM-powered analysis to optimize AWS Auto Scaling Group step policies"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
    "click>=8.1.0",
    "anthropic>=0.40.0",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "moto[autoscaling,cloudwatch,ec2,iam]>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
ai-asg-advisor = "ai_asg_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
